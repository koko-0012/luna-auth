name: Verify Luna Auth
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [fabric, paper]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test
        run: bash fabric/gradlew -p ${{ matrix.project }} --no-daemon --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx2G' build
      - uses: actions/upload-artifact@v4
        with:
          name: luna-auth-${{ matrix.project }}
          path: ${{ matrix.project }}/build/libs/*.jar
          if-no-files-found: error
